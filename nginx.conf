server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA de Flutter web: cualquier ruta cae a index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Assets generados: cachear, pero no el service worker (para no servir versiones viejas)
    location ~* \.(?:js|wasm|css|png|jpg|jpeg|gif|svg|ico|woff2?|ttf)$ {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    location = /flutter_service_worker.js {
        add_header Cache-Control "no-cache";
    }

    gzip on;
    gzip_types text/css application/javascript application/json application/wasm image/svg+xml;
    gzip_min_length 1024;
}
